<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>トラックチェック</title>
<style>
:root {
  --primary: #1a3a5c;
  --accent:  #e85d04;
  --ok:      #2d6a4f;
  --ng:      #c1121f;
  --bg:      #f0f4f8;
  --card:    #ffffff;
  --border:  #d0dce8;
  --text:    #1a2530;
  --sub:     #5a6a78;
  --warn:    #7d4e00;
  --warn-bg: #fff8e0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 15px; padding-bottom: 90px;
}

/* ヘッダー */
header {
  background: var(--primary); color: #fff;
  padding: 12px 16px 8px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
header h1 { font-size: 18px; font-weight: 700; }
header p  { font-size: 11px; opacity: 0.7; margin-top: 2px; }
.header-sub {
  font-size: 11px; opacity: 0.8; margin-top: 4px;
  background: rgba(255,255,255,0.1);
  padding: 3px 8px; border-radius: 6px; display: inline-block;
}

/* カード共通 */
.card {
  background: var(--card); margin: 10px 12px 0;
  border-radius: 10px; border: 1px solid var(--border); overflow: hidden;
}
.card-title {
  background: var(--primary); color: #fff;
  font-size: 12px; font-weight: 700;
  padding: 7px 14px; letter-spacing: 0.06em;
}
.card-title.green  { background: #2c5f2e; }
.card-title.orange { background: var(--accent); }
.card-title.warn   { background: #8b5e00; }

/* フォーム */
.form-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0;
}
.form-field {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
}
.form-field:nth-child(even) { border-right: none; }
.form-field.full { grid-column: 1/-1; border-right: none; }
.form-field label {
  display: block; font-size: 10px; color: var(--sub);
  font-weight: 700; letter-spacing: 0.05em; margin-bottom: 3px;
}
.form-field label .req { color: var(--accent); margin-left: 2px; }
.form-field input, .form-field select {
  width: 100%; border: 1px solid var(--border); border-radius: 6px;
  padding: 7px 9px; font-size: 14px; background: var(--bg); color: var(--text);
  -webkit-appearance: none;
}
.form-field input:focus, .form-field select:focus {
  outline: none; border-color: var(--primary); background: #fff;
}

/* アラートバナー */
.alert-banner {
  margin: 10px 12px 0; border-radius: 10px; overflow: hidden;
}
.alert-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 14px; border-bottom: 1px solid rgba(0,0,0,0.08);
}
.alert-item:last-child { border-bottom: none; }
.alert-item.red   { background: #fff0f0; }
.alert-item.warn  { background: #fff8e0; }
.alert-item.ok    { background: #f0fff4; }
.alert-icon { font-size: 20px; flex-shrink: 0; }
.alert-text strong { font-size: 12px; font-weight: 700; display: block; margin-bottom: 2px; }
.alert-text span   { font-size: 10px; color: var(--sub); }
.alert-next-date {
  display: flex; gap: 6px; margin-top: 6px; align-items: center;
}
.alert-next-date input {
  border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 8px; font-size: 12px; background: var(--bg); flex: 1;
}
.alert-next-date button {
  padding: 5px 12px; background: var(--accent); color: #fff;
  border: none; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer;
}

/* ナンバー撮影 */
.photo-section { padding: 10px 12px; }
.btn-photo {
  width: 100%; padding: 12px; background: #2c5f2e; color: #fff;
  border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer;
}
.btn-photo.taken { background: var(--ok); }
.photo-thumb {
  width: 100%; border-radius: 8px; margin-top: 8px;
  border: 1px solid var(--border); display: none; object-fit: cover; height: 90px;
}
.photo-thumb.show { display: block; }
.photo-remove {
  font-size: 10px; color: var(--ng); cursor: pointer;
  margin-top: 4px; text-decoration: underline; display: none;
}
.photo-remove.show { display: block; text-align: center; }

/* タイマー */
.timer-bar {
  display: none; background: var(--card);
  margin: 8px 12px 0; border-radius: 10px;
  border: 2px solid var(--accent); overflow: hidden;
}
.timer-bar.show { display: block; }
.timer-inner {
  display: flex; align-items: center; gap: 12px; padding: 10px 14px;
}
.timer-value { font-size: 24px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.timer-label { font-size: 11px; color: var(--sub); }
.timer-msg { padding: 6px 14px; font-size: 12px; font-weight: 700; display: none; }
.timer-msg.ok   { background: #d8f3dc; color: var(--ok); display: block; }
.timer-msg.warn { background: #ffe0e0; color: var(--ng); display: block; }

/* 点検項目 */
.check-item {
  padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--card);
}
.check-item:last-child { border-bottom: none; }
.item-label { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.item-guide { font-size: 11px; color: var(--sub); margin-bottom: 8px; line-height: 1.5; }
.btn-group { display: flex; gap: 6px; }
.btn-check {
  flex: 1; padding: 10px 4px; border: 2px solid var(--border);
  border-radius: 8px; background: var(--bg); font-size: 13px; font-weight: 700;
  cursor: pointer; text-align: center; transition: all 0.15s;
}
.btn-check.ok { border-color: var(--ok); background: #d8f3dc; color: var(--ok); }
.btn-check.ng { border-color: var(--ng); background: #ffe0e0; color: var(--ng); }
.btn-check.na { border-color: var(--sub); background: #e9ecef; color: var(--sub); }
.ng-note {
  display: none; margin-top: 6px;
  background: #fff0f0; border-left: 3px solid var(--ng);
  padding: 6px 10px; font-size: 11px; color: var(--ng); border-radius: 0 6px 6px 0;
}
.ng-note.show { display: block; }
.note-input {
  width: 100%; margin-top: 6px; border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 10px; font-size: 12px;
  background: var(--bg); resize: none; height: 50px; font-family: inherit;
}

/* フッターボタン */
.footer-btns {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--primary); padding: 10px 14px 14px;
  box-shadow: 0 -3px 12px rgba(0,0,0,0.2);
}
.btn-submit {
  width: 100%; padding: 14px; background: var(--accent); color: #fff;
  border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
  cursor: pointer; letter-spacing: 0.04em;
}
.btn-submit:disabled { background: #aaa; cursor: not-allowed; }

/* 承認モーダル */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.65); z-index: 200;
  align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: #fff; border-radius: 16px;
  padding: 28px 22px; margin: 20px; max-width: 380px; width: 100%;
  text-align: center;
}
.modal-icon { font-size: 48px; margin-bottom: 12px; }
.modal-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.modal-title.ok { color: var(--ok); }
.modal-title.ng { color: var(--ng); }
.modal-body { font-size: 13px; color: var(--sub); line-height: 1.7; margin-bottom: 20px; }
.modal-time { font-size: 11px; color: var(--sub); margin-top: 8px; }
.btn-modal-close {
  width: 100%; padding: 13px; border: none; border-radius: 10px;
  font-size: 15px; font-weight: 700; cursor: pointer;
  background: var(--primary); color: #fff;
}

/* 電話モーダル */
.phone-box { background: #fff; border-radius: 16px; padding: 24px 20px; margin: 20px; max-width: 380px; width: 100%; }
.phone-box h2 { font-size: 16px; color: var(--ng); font-weight: 700; margin-bottom: 6px; }
.phone-box p  { font-size: 12px; color: var(--sub); line-height: 1.6; margin-bottom: 14px; }
.phone-btn {
  display: block; width: 100%; padding: 13px; margin-bottom: 8px;
  border-radius: 10px; border: none; font-size: 14px; font-weight: 700;
  cursor: pointer; text-align: center; text-decoration: none;
  color: #fff; background: var(--primary);
}
.btn-close-phone {
  width: 100%; padding: 11px; margin-top: 8px; border-radius: 8px;
  border: none; font-size: 13px; background: var(--border); color: var(--text);
  cursor: pointer; font-weight: 700;
}

/* 画面切替 */
.screen { display: none; }
.screen.active { display: block; }

.ng-photo-area {
  display: none; margin-top: 8px;
  background: #fff8f8; border: 1px dashed var(--ng);
  border-radius: 8px; padding: 8px 10px;
}
.ng-photo-area.show { display: block; }
.btn-ng-photo {
  width: 100%; padding: 9px; background: var(--ng); color: #fff;
  border: none; border-radius: 7px; font-size: 13px; font-weight: 700;
  cursor: pointer; margin-bottom: 6px;
}
.btn-ng-photo.taken { background: #6c4a4a; }
.ng-photo-thumb {
  width: 100%; border-radius: 6px; border: 1px solid #f5a0a0;
  display: none; object-fit: cover; max-height: 130px;
}
.ng-photo-thumb.show { display: block; }
.ng-photo-remove {
  font-size: 10px; color: var(--ng); cursor: pointer;
  margin-top: 4px; text-decoration: underline; display: none;
}
.ng-photo-remove.show { display: block; }
#resizeCanvas { display: none; }
</style>
</head>
<body>

<header>
  <h1>🚛 トラックチェック</h1>
  <p>始業前日常点検アプリ</p>
  <span class="header-sub" id="headerInfo">初期設定を入力してください</span>
</header>

<!-- ========== 画面1：初期設定 ========== -->
<div id="screenSetup" class="screen active">

  <!-- アラートバナー（点検前通知） -->
  <div id="alertBanner" class="alert-banner" style="display:none"></div>

  <!-- 車両情報 -->
  <div class="card">
    <div class="card-title">🚛 車両情報</div>
    <div class="form-grid">
      <div class="form-field full">
        <label>車両番号 <span class="req">*</span></label>
        <input type="text" id="plateNo" placeholder="例）札幌 100 あ 1234" oninput="onPlateInput(this.value)">
        <div id="plateMsg" style="font-size:11px;color:var(--ok);margin-top:3px;display:none">✅ 車両情報を読み込みました</div>
      </div>
      <div class="form-field">
        <label>車種 <span class="req">*</span></label>
        <select id="vehicleType">
          <option value="">選択</option>
          <option>普通トラック</option>
          <option>大型トラック</option>
          <option>トレーラー</option>
          <option>その他</option>
        </select>
      </div>
      <div class="form-field">
        <label>ドライバー名 <span class="req">*</span></label>
        <input type="text" id="driverName" placeholder="氏名">
      </div>
      <div class="form-field full">
        <label>現在の走行距離 (km) <span class="req">*</span></label>
        <input type="number" id="odometer" placeholder="例）125480" oninput="checkAlerts()">
      </div>
    </div>
  </div>

  <!-- メンテナンス情報 -->
  <div class="card">
    <div class="card-title warn">🔧 メンテナンス情報</div>
    <div class="form-grid">
      <div class="form-field">
        <label>前回オイル交換日</label>
        <input type="date" id="lastOilDate">
      </div>
      <div class="form-field">
        <label>その時の走行距離(km)</label>
        <input type="number" id="lastOilKm" placeholder="例）120000">
      </div>
      <div class="form-field">
        <label>前回3ヶ月点検日</label>
        <input type="date" id="last3mDate">
      </div>
      <div class="form-field">
        <label>次回3ヶ月点検予定日</label>
        <input type="date" id="next3mDate">
      </div>
      <div class="form-field">
        <label>前回車検日</label>
        <input type="date" id="lastShaken">
      </div>
      <div class="form-field">
        <label>次回車検予定日</label>
        <input type="date" id="nextShaken">
      </div>
    </div>
  </div>

  <!-- 運行区間 -->
  <div class="card">
    <div class="card-title">📋 本日の運行</div>
    <div class="form-grid">
      <div class="form-field full">
        <label>運行区間</label>
        <input type="text" id="route" placeholder="例）札幌→旭川">
      </div>
    </div>
  </div>

  <div style="padding:12px">
    <button class="btn-submit" onclick="goToCheck()">点検を開始する →</button>
  </div>
</div>

<!-- ========== 画面2：点検 ========== -->
<div id="screenCheck" class="screen">

  <!-- タイマー -->
  <div class="timer-bar" id="timerBar">
    <div class="timer-inner">
      <span style="font-size:22px">⏱️</span>
      <div>
        <div class="timer-label">点検所要時間</div>
        <div class="timer-value" id="timerVal">00:00</div>
        <div class="timer-label" id="timerStatus">ナンバー撮影から計測中…</div>
      </div>
    </div>
    <div class="timer-msg" id="timerMsg"></div>
  </div>

  <!-- 点検項目 -->
  <div id="checkList"></div>

  <!-- メーター撮影（点検終了） -->
  <div class="card" style="border-color:#2c5f2e;margin-top:10px">
    <div class="card-title green">📷 最後にメーターパネル全体を撮影（警告灯・走行距離を確認）</div>
    <div class="photo-section">
      <button class="btn-photo" id="btnMeter" onclick="takePhoto('meter')" style="background:#1a3a5c">📷 メーターパネル全体を撮影して終了</button>
      <img class="photo-thumb" id="thumbMeter" alt="メーター">
      <div class="photo-remove" id="removeMeter" onclick="removePhoto('meter')">× 撮り直す</div>
    </div>
  </div>

  <div class="footer-btns">
    <button class="btn-submit" id="btnSubmit" onclick="submitCheck()">📋 点検データを送信</button>
  </div>
</div>

<!-- 承認結果モーダル -->
<div class="modal-overlay" id="resultModal">
  <div class="modal-box">
    <div class="modal-icon" id="resultIcon"></div>
    <div class="modal-title" id="resultTitle"></div>
    <div class="modal-body" id="resultBody"></div>
    <div class="modal-time" id="resultTime"></div>
    <button class="btn-modal-close" onclick="closeResult()">閉じる</button>
  </div>
</div>

<!-- 電話モーダル -->
<div class="modal-overlay" id="phoneModal">
  <div class="phone-box">
    <h2>⚠️ 異常が確認されました</h2>
    <p>運行管理者に電話して指示を仰いでください。<br>本日の担当管理者を選択してください。</p>
    <div id="phoneBtns"></div>
    <button class="btn-close-phone" onclick="closePhone(true)" style="background:var(--accent);color:#fff;margin-bottom:8px">📋 管理者に連絡済み・データを送信する</button>
    <button class="btn-close-phone" onclick="closePhone(false)">キャンセル（点検に戻る）</button>
  </div>
</div>

<canvas id="resizeCanvas"></canvas>

<script>
// ============================================================
// 設定
// ============================================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwYLYnhqxC2xlgNMHMXMcrAtP2OruVM4RGBQEnsIGgUDrFsm-lZbRec6vYBgt93IfcmHw/exec';

// 法定点検項目（最小限）
const CHECKS = [
  { id:'c01', cat:'ブレーキ',             label:'フットブレーキの踏みしろ・効き',       guide:'ペダルの踏み代が適正で効きが十分か。片効きしていないか', na:false },
  { id:'c02', cat:'ブレーキ',             label:'駐車ブレーキの引きしろ',              guide:'引きしろが適正か（カチカチ音で確認）', na:false },
  { id:'c03', cat:'ブレーキ',             label:'エアブレーキ・空気圧',               guide:'警告ブザー消灯まで確認（エア車のみ）', na:true },
  { id:'c04', cat:'タイヤ',               label:'空気圧・亀裂・損傷・溝の深さ（全輪）', guide:'目視と手で確認。異物刺さりがないか', na:false },
  { id:'c05', cat:'タイヤ',               label:'ホイールナットの緩み',               guide:'目視でさび汁・脱落がないか（8t以上は必須）', na:false },
  { id:'c06', cat:'エンジン',             label:'エンジンオイル量',                   guide:'レベルゲージでMin〜Max間にあるか', na:false },
  { id:'c07', cat:'エンジン',             label:'冷却水量',                          guide:'サブタンクでMin〜Max間にあるか', na:false },
  { id:'c08', cat:'エンジン',             label:'エンジンのかかり具合・異音',           guide:'スムーズに始動するか。異音・異臭がないか', na:false },
  { id:'c09', cat:'灯火類',              label:'灯火装置の点灯・点滅（全灯火）',        guide:'前照灯・制動灯・方向指示器・後退灯が正常か', na:false },
  { id:'c10', cat:'ウォッシャー・ワイパー', label:'ウォッシャー液量・噴射・ワイパー払拭', guide:'液量確認、噴射OK・ワイパー拭き取り正常か', na:false },
  { id:'c11', cat:'エアタンク',            label:'エアタンクの凝水',                  guide:'ドレーンコックを開いて水分を排出（エア車のみ）', na:true },
  { id:'c12', cat:'運転者',              label:'アルコール検知器による確認',           guide:'検知器を使用し酒気帯びがないことを確認', na:false },
  { id:'c13', cat:'運転者',              label:'体調・疲労・服薬の確認',              guide:'発熱・頭痛・過度の疲労・眠気を催す薬がないか', na:false },
];

let checkData = {};
let photos = { plate: null, meter: null };
let vehicleData = null;
let managers = [];
let timerStart = null, timerEnd = null, timerInterval = null;
let plateInputTimer = null;

// ============================================================
// 起動時処理
// ============================================================
window.addEventListener('load', () => {
  buildCheckList();
  loadManagersFromGAS();
  // ローカルに保存済みの車両情報があれば復元
  const saved = JSON.parse(localStorage.getItem('vehicleInfo') || 'null');
  if (saved) restoreVehicleInfo(saved);
});

// ============================================================
// 車両情報の復元
// ============================================================
function restoreVehicleInfo(d) {
  if (d.plateNo)     document.getElementById('plateNo').value     = d.plateNo;
  if (d.vehicleType) document.getElementById('vehicleType').value = d.vehicleType;
  if (d.driverName)  document.getElementById('driverName').value  = d.driverName;
  if (d.lastOilDate) document.getElementById('lastOilDate').value = d.lastOilDate;
  if (d.lastOilKm)   document.getElementById('lastOilKm').value   = d.lastOilKm;
  if (d.last3mDate)  document.getElementById('last3mDate').value  = d.last3mDate;
  if (d.next3mDate)  document.getElementById('next3mDate').value  = d.next3mDate;
  if (d.lastShaken)  document.getElementById('lastShaken').value  = d.lastShaken;
  if (d.nextShaken)  document.getElementById('nextShaken').value  = d.nextShaken;
  vehicleData = d;
  updateHeader();
  checkAlerts();
}

function updateHeader() {
  const plate = document.getElementById('plateNo').value;
  const driver = document.getElementById('driverName').value;
  if (plate || driver) {
    document.getElementById('headerInfo').textContent =
      `${plate || ''}　${driver || ''}`;
  }
}

// ============================================================
// ナンバー入力→GASから車両情報取得
// ============================================================
function onPlateInput(val) {
  clearTimeout(plateInputTimer);
  updateHeader();
  if (val.replace(/\s/g,'').length < 4) return;
  plateInputTimer = setTimeout(async () => {
    try {
      const res = await fetch(`${GAS_URL}?action=getVehicle&plateNo=${encodeURIComponent(val.trim())}`);
      const json = await res.json();
      if (json.status === 'success' && json.data) {
        const d = json.data;
        vehicleData = d;
        if (d.vehicleType) {
          const sel = document.getElementById('vehicleType');
          [...sel.options].forEach(o => { if(o.value===d.vehicleType) sel.value=d.vehicleType; });
        }
        if (d.driverName)  document.getElementById('driverName').value  = d.driverName;
        if (d.lastOilDate) document.getElementById('lastOilDate').value = d.lastOilDate;
        if (d.lastOilKm)   document.getElementById('lastOilKm').value   = d.lastOilKm;
        if (d.last3mDate)  document.getElementById('last3mDate').value  = d.last3mDate;
        if (d.next3mDate)  document.getElementById('next3mDate').value  = d.next3mDate;
        if (d.lastShaken)  document.getElementById('lastShaken').value  = d.lastShaken;
        if (d.nextShaken)  document.getElementById('nextShaken').value  = d.nextShaken;
        const msg = document.getElementById('plateMsg');
        msg.style.display='block';
        setTimeout(()=>msg.style.display='none',3000);
        checkAlerts();
        updateHeader();
      }
    } catch(e) { console.log('車両取得エラー:', e); }
  }, 800);
}

// ============================================================
// アラートチェック（3ヶ月点検・オイル・車検）
// ============================================================
function checkAlerts() {
  const km       = parseInt(document.getElementById('odometer').value) || 0;
  const lastOilKm  = parseInt(document.getElementById('lastOilKm').value)   || 0;
  const next3m     = document.getElementById('next3mDate').value;
  const nextShaken = document.getElementById('nextShaken').value;

  const alerts = [];
  const today  = new Date(); today.setHours(0,0,0,0);

  // オイル交換（5,000km毎）
  const oilNextKm = lastOilKm + 5000;
  const oilDiff   = km - lastOilKm;
  const oilLeft   = oilNextKm - km;
  if (km > 0 && lastOilKm > 0) {
    if (oilLeft <= 0) {
      alerts.push({ cls:'red', icon:'🔴', title:`オイル交換が超過しています`, sub:`前回交換から${oilDiff.toLocaleString()}km走行（次回予定：${oilNextKm.toLocaleString()}km）`, type:'oil', nextKm: oilNextKm });
    } else if (oilLeft <= 500) {
      alerts.push({ cls:'warn', icon:'🟡', title:`オイル交換まであと${oilLeft.toLocaleString()}km`, sub:`次回予定距離：${oilNextKm.toLocaleString()}km`, type:'oil', nextKm: oilNextKm });
    }
  }

  // 3ヶ月点検
  if (next3m) {
    const d = new Date(next3m); d.setHours(0,0,0,0);
    const days = Math.ceil((d - today) / 86400000);
    if (days <= 0) {
      alerts.push({ cls:'red', icon:'🔴', title:`3ヶ月点検の予定日を過ぎています（${Math.abs(days)}日超過）`, sub:`次回予定日：${next3m}`, type:'3m', needDate:true });
    } else if (days <= 14) {
      alerts.push({ cls:'warn', icon:'🟡', title:`3ヶ月点検まであと${days}日`, sub:`次回予定日：${next3m}`, type:'3m' });
    }
  } else {
    alerts.push({ cls:'warn', icon:'🟡', title:'3ヶ月点検の次回予定日が未設定', sub:'管理者に確認して予定日を入力してください', type:'3m', needDate:true });
  }

  // 車検
  if (nextShaken) {
    const d = new Date(nextShaken); d.setHours(0,0,0,0);
    const days = Math.ceil((d - today) / 86400000);
    if (days <= 0) {
      alerts.push({ cls:'red', icon:'🔴', title:`車検の期限が切れています（${Math.abs(days)}日超過）`, sub:`次回車検予定日：${nextShaken}`, type:'shaken', needDate:true });
    } else if (days <= 30) {
      alerts.push({ cls:'warn', icon:'🟡', title:`車検まであと${days}日`, sub:`次回車検予定日：${nextShaken}`, type:'shaken' });
    }
  } else {
    alerts.push({ cls:'warn', icon:'🟡', title:'車検の次回予定日が未設定', sub:'管理者に確認して予定日を入力してください', type:'shaken', needDate:true });
  }

  const banner = document.getElementById('alertBanner');
  if (alerts.length === 0) {
    banner.style.display = 'none';
    return;
  }

  banner.style.display = 'block';
  banner.innerHTML = `
    <div style="background:#8b5e00;color:#fff;font-size:12px;font-weight:700;padding:7px 14px;border-radius:10px 10px 0 0;letter-spacing:0.06em">
      🔔 メンテナンス通知（次回予定日を設定するまで毎回表示されます）
    </div>
    ${alerts.map(a => `
      <div class="alert-item ${a.cls}">
        <span class="alert-icon">${a.icon}</span>
        <div class="alert-text" style="flex:1">
          <strong>${a.title}</strong>
          <span>${a.sub}</span>
          ${a.needDate ? `
          <div class="alert-next-date">
            <input type="date" id="alertDate_${a.type}" placeholder="次回予定日">
            <button onclick="saveNextDate('${a.type}')">保存</button>
          </div>` : ''}
        </div>
      </div>
    `).join('')}
  `;
}

function saveNextDate(type) {
  const val = document.getElementById(`alertDate_${type}`)?.value;
  if (!val) { alert('日付を入力してください'); return; }
  if (type === '3m')     document.getElementById('next3mDate').value = val;
  if (type === 'shaken') document.getElementById('nextShaken').value = val;
  // GASに保存
  const plate = document.getElementById('plateNo').value;
  if (plate) {
    const upd = { action:'updateSchedule', plateNo: plate };
    if (type === '3m')     upd.next3mDate = val;
    if (type === 'shaken') upd.nextShaken  = val;
    fetch(GAS_URL, { method:'POST', mode:'no-cors',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(upd) });
  }
  checkAlerts();
}

// ============================================================
// 点検リスト構築
// ============================================================
function buildCheckList() {
  const container = document.getElementById('checkList');
  let currentCat = '';

  CHECKS.forEach(item => {
    checkData[item.id] = { result:null, note:'', photo:null };

    if (item.cat !== currentCat) {
      currentCat = item.cat;
      const catDiv = document.createElement('div');
      catDiv.className = 'card';
      catDiv.style.marginTop = '10px';
      catDiv.innerHTML = `<div class="card-title">📋 ${item.cat}</div>`;
      container.appendChild(catDiv);
    }

    const div = document.createElement('div');
    div.className = 'check-item';
    div.id = 'item_' + item.id;
    div.innerHTML = `
      <div class="item-label">${item.label}</div>
      <div class="item-guide">${item.guide}</div>
      <div class="btn-group">
        <button class="btn-check" onclick="setCheck('${item.id}','ok',this)">✅ 異常なし</button>
        <button class="btn-check" onclick="setCheck('${item.id}','ng',this)">❌ 異常あり</button>
        ${item.na ? `<button class="btn-check" onclick="setCheck('${item.id}','na',this)">－ 該当なし</button>` : ''}
      </div>
      <div class="ng-note" id="note_${item.id}">
        ⚠️ 異常内容を記入してください
        <textarea class="note-input" id="noteText_${item.id}" placeholder="異常の内容を記入" oninput="checkData['${item.id}'].note=this.value"></textarea>
        <div class="ng-photo-area" id="ngphoto_${item.id}">
          <div style="font-size:10px;color:var(--ng);margin-bottom:4px">📷 異常箇所の写真（自動縮小）</div>
          <button class="btn-ng-photo" onclick="takeNgPhoto('${item.id}')">📷 異常箇所を撮影</button>
          <img class="ng-photo-thumb" id="ngthumb_${item.id}" alt="異常写真">
          <div class="ng-photo-remove" id="ngremove_${item.id}" onclick="removeNgPhoto('${item.id}')">× 写真を削除</div>
        </div>
      </div>
    `;
    container.appendChild(div);
  });
}

function setCheck(id, result, btn) {
  checkData[id].result = result;
  document.getElementById('item_' + id)
    .querySelectorAll('.btn-check').forEach(b => b.className = 'btn-check');
  btn.classList.add(result);
  const noteEl = document.getElementById('note_' + id);
  if (result === 'ng') {
    noteEl.classList.add('show');
    document.getElementById('ngphoto_' + id)?.classList.add('show');
  } else {
    noteEl.classList.remove('show');
    document.getElementById('ngphoto_' + id)?.classList.remove('show');
    removeNgPhoto(id);
  }
}

// ============================================================
// 画面遷移
// ============================================================
function goToCheck() {
  const plate  = document.getElementById('plateNo').value.trim();
  const driver = document.getElementById('driverName').value.trim();
  const odo    = document.getElementById('odometer').value.trim();
  if (!plate)  { alert('車両番号を入力してください'); return; }
  if (!driver) { alert('ドライバー名を入力してください'); return; }
  if (!odo)    { alert('現在の走行距離を入力してください'); return; }

  // ローカルに保存
  const vInfo = {
    plateNo:     plate,
    vehicleType: document.getElementById('vehicleType').value,
    driverName:  driver,
    lastOilDate: document.getElementById('lastOilDate').value,
    lastOilKm:   document.getElementById('lastOilKm').value,
    last3mDate:  document.getElementById('last3mDate').value,
    next3mDate:  document.getElementById('next3mDate').value,
    lastShaken:  document.getElementById('lastShaken').value,
    nextShaken:  document.getElementById('nextShaken').value,
  };
  localStorage.setItem('vehicleInfo', JSON.stringify(vInfo));

  // GASの車両マスタに登録・更新
  registerVehicleToGAS(vInfo);

  document.getElementById('screenSetup').classList.remove('active');
  document.getElementById('screenCheck').classList.add('active');
  window.scrollTo(0,0);
  // 点検開始と同時にタイマースタート
  startTimer();
}

// ============================================================
// 写真撮影
// ============================================================
function resizeImage(file, maxSize, quality, cb) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      let w=img.width, h=img.height;
      if (w>h) { if(w>maxSize){h=h*maxSize/w;w=maxSize;} }
      else     { if(h>maxSize){w=w*maxSize/h;h=maxSize;} }
      const canvas = document.getElementById('resizeCanvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// 画像をカメラロールに保存
function saveToCamera(b64, filename) {
  try {
    const a = document.createElement('a');
    a.href = b64;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  } catch(e) { console.log('カメラロール保存失敗:', e); }
}

function takeNgPhoto(id) {
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.capture='environment';
  inp.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    resizeImage(file, 800, 0.6, b64 => {
      const thumb  = document.getElementById('ngthumb_' + id);
      const remove = document.getElementById('ngremove_' + id);
      const btn    = document.querySelector(`#ngphoto_${id} .btn-ng-photo`);
      checkData[id].photo = b64;
      thumb.src = b64; thumb.classList.add('show');
      remove.classList.add('show');
      if (btn) { btn.textContent='📷 撮り直す'; btn.classList.add('taken'); }
      // 異常写真をカメラロールに保存
      const nowNg = new Date();
      const plateNg = (document.getElementById('plateNo').value || 'unknown').replace(/\s/g,'');
      const dateNg = nowNg.toISOString().slice(0,16).replace(/[-T:]/g,'');
      const item = CHECKS.find(c => c.id === id);
      const label = item ? item.label.slice(0,10) : id;
      saveToCamera(b64, `${plateNg}_${dateNg}_異常_${label}.jpg`);
    });
  };
  inp.click();
}

function removeNgPhoto(id) {
  if (!checkData[id]) return;
  checkData[id].photo = null;
  const thumb  = document.getElementById('ngthumb_' + id);
  const remove = document.getElementById('ngremove_' + id);
  const btn    = document.querySelector(`#ngphoto_${id} .btn-ng-photo`);
  if (thumb)  { thumb.classList.remove('show'); thumb.src=''; }
  if (remove) { remove.classList.remove('show'); }
  if (btn)    { btn.textContent='📷 異常箇所を撮影'; btn.classList.remove('taken'); }
}

function takePhoto(type) {
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.capture='environment';
  inp.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const maxSize = type==='plate' ? 1200 : 1200;
    resizeImage(file, maxSize, 0.7, b64 => {
      photos[type] = b64;
      const isPlate = type==='plate';
      const thumb  = document.getElementById(isPlate?'thumbPlate':'thumbMeter');
      const remove = document.getElementById(isPlate?'removePlate':'removeMeter');
      const btn    = document.getElementById(isPlate?'btnPlate':'btnMeter');
      thumb.src=b64; thumb.classList.add('show');
      remove.classList.add('show');
      btn.textContent='📷 撮り直す'; btn.classList.add('taken');
      if (isPlate) startTimer();
      if (!isPlate && timerStart) {
        stopTimer();
        // メーター写真をカメラロールに保存
        const now = new Date();
        const plate = (document.getElementById('plateNo').value || 'unknown').replace(/\s/g,'');
        const dateStr = now.toISOString().slice(0,16).replace(/[-T:]/g,'');
        saveToCamera(b64, `${plate}_${dateStr}_メーター.jpg`);
      }
    });
  };
  inp.click();
}

function removePhoto(type) {
  photos[type] = null;
  const isPlate = type==='plate';
  const thumb  = document.getElementById(isPlate?'thumbPlate':'thumbMeter');
  const remove = document.getElementById(isPlate?'removePlate':'removeMeter');
  const btn    = document.getElementById(isPlate?'btnPlate':'btnMeter');
  thumb.classList.remove('show'); thumb.src='';
  remove.classList.remove('show');
  btn.textContent = isPlate ? '📷 ナンバープレートを撮影してスタート' : '📷 メーターパネル全体を撮影して終了';
  btn.classList.remove('taken');
  if (isPlate) { clearInterval(timerInterval); timerStart=null; document.getElementById('timerBar').classList.remove('show'); }
  if (!isPlate && timerStart) { timerEnd=null; document.getElementById('timerMsg').className='timer-msg'; startTimerTick(); }
}

// ============================================================
// タイマー
// ============================================================
function fmt(sec) { return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); }

function startTimer() {
  timerStart = new Date();
  document.getElementById('timerBar').classList.add('show');
  document.getElementById('timerStatus').textContent = '点検開始から計測中…';
  startTimerTick();
}
function startTimerTick() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (timerEnd) return;
    document.getElementById('timerVal').textContent = fmt(Math.floor((new Date()-timerStart)/1000));
  }, 1000);
}
function stopTimer() {
  timerEnd = new Date();
  clearInterval(timerInterval);
  const sec = Math.floor((timerEnd - timerStart) / 1000);
  document.getElementById('timerVal').textContent = fmt(sec);
  document.getElementById('timerStatus').textContent = 'メーター撮影で計測完了';
  // タイマーメッセージは最後の承認画面に表示するためここでは非表示
  document.getElementById('timerMsg').className = 'timer-msg';
}

// ============================================================
// 電話モーダル
// ============================================================
function showPhoneModal() {
  document.getElementById('phoneBtns').innerHTML = managers.map(m =>
    m.tel
      ? `<a class="phone-btn" href="tel:${m.tel}">📞 ${m.name}（${m.tel}）</a>`
      : `<button class="phone-btn" style="background:#aaa" disabled>📞 ${m.name}（未設定）</button>`
  ).join('') || '<p style="color:#aaa;font-size:13px">管理者が登録されていません</p>';
  document.getElementById('phoneModal').classList.add('show');
}
function closePhone(sendAfter=false) {
  document.getElementById('phoneModal').classList.remove('show');
  if (sendAfter) finalSubmit();
}

// ============================================================
// GAS：車両マスタ登録・更新
// ============================================================
async function registerVehicleToGAS(info) {
  try {
    const payload = Object.assign({ action: 'registerVehicle' }, info);
    await fetch(GAS_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    console.log('車両マスタ登録送信完了');
  } catch(e) { console.log('車両マスタ登録エラー:', e); }
}

// ============================================================
// GAS：管理者取得
// ============================================================
async function loadManagersFromGAS() {
  try {
    const res = await fetch(`${GAS_URL}?action=getManagers`);
    const json = await res.json();
    if (json.status==='success' && json.data) managers = json.data;
  } catch(e) { console.log('管理者取得失敗:', e); }
}

// ============================================================
// 送信
// ============================================================
async function submitCheck() {
  // 必須チェック
  if (!photos.meter) { alert('メーターパネルの写真を撮影してください'); return; }

  const missing = CHECKS.filter(c => !c.na && checkData[c.id].result === null);
  if (missing.length > 0) {
    alert(`未確認の項目があります：\n${missing.map(c=>c.label).join('\n')}`);
    return;
  }

  // 異常がある場合は電話モーダルを表示
  const ngItems2 = CHECKS.filter(c => checkData[c.id].result === 'ng').map(c => c.label);
  if (ngItems2.length > 0) {
    showPhoneModal();
    return;  // 電話モーダルを閉じた後にfinalSubmit()で送信
  }
  finalSubmit();
}

async function finalSubmit() {
  const btn = document.getElementById('btnSubmit');
  btn.textContent = '送信中…'; btn.disabled = true;

  const ngItems = CHECKS.filter(c => checkData[c.id].result === 'ng').map(c => c.label);
  const now = new Date();
  const timerSec = (timerStart && timerEnd) ? Math.floor((timerEnd-timerStart)/1000) : null;

  // 全項目の結果をまとめる
  const itemsData = {};
  CHECKS.forEach(c => {
    itemsData[c.id] = {
      result: checkData[c.id].result,
      note:   checkData[c.id].note || '',
    };
  });

  // 異常写真を収集
  const ngPhotos = CHECKS
    .filter(c => checkData[c.id].result === 'ng' && checkData[c.id].photo)
    .map(c => ({ label: c.label, photo: checkData[c.id].photo }));

  const payload = {
    action:          'saveRecord',
    plateNo:         document.getElementById('plateNo').value,
    vehicleType:     document.getElementById('vehicleType').value,
    driverName:      document.getElementById('driverName').value,
    checkDate:       now.toISOString().slice(0,16).replace('T',' '),
    odometer:        document.getElementById('odometer').value,
    route:           document.getElementById('route').value,
    ngCount:         ngItems.length,
    ngItems:         ngItems,
    inspectionTime:  timerSec ? fmt(timerSec) : '',
    overallNote:     '',
    items:           itemsData,
    photoPlate:      false,
    photoMeter:      photos.meter ? true : false,
    photoMeterData:  photos.meter || null,
    ngPhotos:        ngPhotos,
    submittedAt:     now.toISOString(),
  };

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload),
    });
    const json = await res.json();
    const approved = json.approved !== undefined ? json.approved : (ngItems.length === 0);
    showResult(approved, now);

  } catch(e) {
    console.log('送信エラー:', e);
    // オフライン時はngCountで判定
    showResult(ngItems.length === 0, now);
  }

  btn.textContent = '📋 点検データを送信'; btn.disabled = false;
}

function showResult(approved, now) {
  const modal = document.getElementById('resultModal');
  document.getElementById('resultIcon').textContent  = approved ? '✅' : '⚠️';
  document.getElementById('resultTitle').textContent = approved ? '運行許可' : '異常あり';
  document.getElementById('resultTitle').className   = 'modal-title ' + (approved ? 'ok' : 'ng');

  // 点検時間の計算
  let timeMsg = '';
  let timeWarn = false;
  if (timerStart) {
    const endTime = timerEnd || new Date();
    const sec = Math.floor((endTime - timerStart) / 1000);
    timeWarn = sec < 300;
    timeMsg = timeWarn
      ? `⚠️ 点検時間が短すぎます（${fmt(sec)}）\n通常10〜15分かかります。`
      : `⏱️ 点検時間：${fmt(sec)}`;
  }

  document.getElementById('resultBody').innerHTML = (approved
    ? '全項目に異常はありませんでした。<br>安全運転でお願いします。'
    : '異常項目があります。<br>運行管理者に連絡して指示を仰いでください。')
    + (timeMsg ? `<br><br><span style="color:${timeWarn?'#c1121f':'#2d6a4f'};font-weight:700;font-size:13px">${timeMsg.replace(/\n/g,'<br>')}</span>` : '');

  document.getElementById('resultTime').textContent = approved
    ? `自動判定日時：${now.toLocaleString('ja-JP')}` : '';
  modal.classList.add('show');
}

function closeResult() {
  document.getElementById('resultModal').classList.remove('show');
}
